version: "3.1"

services:
  postgres:
    image: postgres:16.2
    restart: always
    ports:
      - 5432:5432
    volumes:
      - dbdata:/data/db
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  backend:
    restart: always
    env_file: ./backend/.env
    environment:
      DB_HOST: postgres
    build: "./backend"
    command: >
      bash -c "./backend/manage.py migrate &&
               ./backend/manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/backend
    ports:
      - "8000:8000"
    depends_on:
      - postgres

volumes:
  dbdata:
